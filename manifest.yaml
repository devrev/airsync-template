version: "2"
name: Tasks Demo
description: Import tasks from a simple Tasks API into DevRev issues
service_account:
  display_name: Tasks Demo Bot
  scopes:
    self:
      - scope: sync_mapper_record:write
        optional: false
        reason: Allow write access to sync mapper records
      - scope: sync_mapper_record:read
        optional: false
        reason: Allow read access to sync mapper records
      - scope: sync_unit:read
        optional: false
        reason: Allow read access to sync units
      - scope: sync_snap_in:all
        optional: false
        reason: Allow AirSync operations
      - scope: sync_history:read
        optional: false
        reason: Allow read access to sync history
functions:
  - name: extraction
    description: Discover projects and extract Tasks API records
keyring_types:
  - id: tasks-api-token
    name: Tasks API Connection
    description: Bearer token for the Tasks API
    external_system_name: Tasks Demo
    kind: Secret
    is_subdomain: false
    secret_config:
      secret_transform: ".token"
      fields:
        - id: token
          name: Token
          description: Tasks API bearer token
          input_type: password
      token_verification:
        url: http://127.0.0.1:3100/projects
        method: GET
        headers:
          Authorization: "Bearer [API_KEY]"
    organization_data:
      type: config
      url: http://127.0.0.1:3100/projects
      method: GET
      headers:
        Authorization: "Bearer [API_KEY]"
      response_jq: '{id: "tasks-demo", name: "Tasks Demo"}'
imports:
  - slug: airsync-tasks-demo
    display_name: Tasks Demo
    description: Import tasks as DevRev issues
    extractor_function: extraction
    allowed_connection_types:
      - tasks-api-token
    capabilities:
      - TIME_SCOPED_SYNCS
