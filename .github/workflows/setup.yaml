name: Set up the repository

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      maintainers:
        description: Space-separated GitHub maintainer logins
        type: string
      owning_team:
        description: GitHub owning team in organization/team-slug format
        type: string

concurrency:
  group: airsync-repository-setup
  cancel-in-progress: false

jobs:
  setup:
    if: >-
      github.repository != 'devrev/airsync-template' &&
      !github.event.repository.fork &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.default_branch == 'main' &&
      (startsWith(github.event.repository.name, 'airdrop-') || startsWith(github.event.repository.name, 'airsync-')) &&
      endsWith(github.event.repository.name, '-snap-in')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: refs/heads/main

      - name: Apply connector defaults
        env:
          AIRSYNC_MAINTAINERS: ${{ inputs.maintainers || vars.AIRSYNC_MAINTAINERS || github.actor }}
          AIRSYNC_OWNING_TEAM: ${{ inputs.owning_team || vars.AIRSYNC_OWNING_TEAM }}
        run: |
          python3 .github/scripts/initialize.py "$GITHUB_REPOSITORY" \
            --maintainers="$AIRSYNC_MAINTAINERS" --owning-team="$AIRSYNC_OWNING_TEAM"

      - name: Publish initialization
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-setup.sh
