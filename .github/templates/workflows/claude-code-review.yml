name: Connector Claude review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, converted_to_draft, closed]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: github.repository_owner == 'devrev' && github.event.repository.private
    uses: devrev/connectors-codegen/.github/workflows/connector-review.yml@main
    secrets:
      CLAUDE_AWS_ROLE_TO_ASSUME: ${{ secrets.CLAUDE_AWS_ROLE_TO_ASSUME }}
      READ_GITHUB_ACTIONS_RELEASES: ${{ secrets.READ_GITHUB_ACTIONS_RELEASES }}
